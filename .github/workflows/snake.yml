name: Contribution snake

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate light and dark snakes
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: Sreedev-a
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0891b2
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#67e8f9

      - name: Publish SVGs to output branch
        shell: bash
        run: |
          set -euo pipefail
          # Keep generated files outside the checkout while switching branches.
          publish_dir="$(mktemp -d "${RUNNER_TEMP}/snake.XXXXXX")"
          cp dist/github-contribution-grid-snake.svg "$publish_dir/"
          cp dist/github-contribution-grid-snake-dark.svg "$publish_dir/"

          # Query first: a network failure must not be mistaken for a new branch.
          remote_branch="$(git ls-remote --heads origin refs/heads/output)"
          if [[ -n "$remote_branch" ]]; then
            git fetch origin output
            git switch --create output --track origin/output
          else
            git switch --orphan output
          fi

          cp "$publish_dir/"*.svg .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution SVGs are unchanged."
            exit 0
          fi
          git commit -m "Update contribution snake"
          # Ordinary push preserves existing output history and rejects conflicts.
          git push origin HEAD:output
