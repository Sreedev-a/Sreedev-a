<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#070914"/>
      <stop offset="100%" stop-color="#081026"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6b5cff" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)" rx="18"/>
  <rect x="48" y="48" width="1184" height="544" rx="14" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.03)"/>

  <!-- left: device mock -->
  <g transform="translate(80,96)">
    <rect x="0" y="0" width="520" height="360" rx="18" fill="#06111e" stroke="rgba(255,255,255,0.02)"/>
    <rect x="24" y="28" width="472" height="304" rx="10" fill="rgba(0,0,0,0.45)"/>
    <rect x="44" y="52" width="140" height="96" rx="8" fill="rgba(0,200,255,0.06)" stroke="#00d9ff" opacity="0.22"/>
    <rect x="200" y="52" width="180" height="96" rx="8" fill="rgba(107,92,255,0.03)" stroke="#6b5cff" opacity="0.12"/>
  </g>

  <!-- right: title and bullets -->
  <g transform="translate(640,140)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="34" fill="#ffffff">AI-Proctored Assessment Platform</text>
    <text x="0" y="40" font-size="15" fill="#cfe9ff">Real-time webcam proctoring, phone detection, multi-person detection and adaptive assessments.</text>

    <g transform="translate(0,88)" fill="#9fb4ff" font-size="13">
      <text x="0" y="0">• Real-time video monitoring</text>
      <text x="0" y="24">• Evidence capture & candidate dashboards</text>
      <text x="0" y="48">• FastAPI · Next.js · Computer Vision</text>
    </g>
  </g>

  <!-- subtle accent glow -->
  <rect x="80" y="480" width="1120" height="40" rx="20" fill="url(#accent)" opacity="0.06" />
</svg>
