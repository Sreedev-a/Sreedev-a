<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Sree Dev A — AI / ML Engineer</title>
  <desc id="description">Machine learning, computer vision and generative AI. Building intelligent systems that turn ideas into reality. Subtle stars and neural networks surround the title.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#050a15"/>
      <stop offset="0.55" stop-color="#0a1429"/>
      <stop offset="1" stop-color="#070b18"/>
    </linearGradient>
    <radialGradient id="cyanOrb">
      <stop stop-color="#0891b2" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="indigoOrb">
      <stop stop-color="#6366f1" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lettering" x2="1" y2="0">
      <stop stop-color="#e0faff"/>
      <stop offset="0.5" stop-color="#f1f5ff"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="beam" x2="1" y2="0">
      <stop stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94a3b8" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="418" rx="24"/></clipPath>
    <radialGradient id="atmosphereGlow">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#background)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <circle cx="160" cy="190" r="290" fill="url(#cyanOrb)">
      <animateTransform attributeName="transform" type="translate" values="0 0;45 -25;0 0" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="230" r="310" fill="url(#indigoOrb)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-45 25;0 0" dur="28s" repeatCount="indefinite"/>
    </circle>

    <!-- Additional engineering atmosphere stays behind the original artwork. -->
    <g id="engineering-atmosphere" opacity="0.1">
      <ellipse cx="600" cy="402" rx="380" ry="70" fill="url(#atmosphereGlow)"/>
      <g fill="none" stroke="#38bdf8" stroke-width="0.75" opacity="0.6">
        <path d="M66 318H226M66 338H226M66 358H226M86 308V378M106 308V378M126 308V378M146 308V378"/>
        <path d="M976 44H1136M976 64H1136M976 84H1136M1016 34V104M1036 34V104M1056 34V104M1076 34V104"/>
      </g>
      <g fill="none" stroke="#67e8f9" stroke-width="1">
        <path d="M52 92H170L206 56H322L346 32H478M724 32H826L850 56H936L970 90H1148"/>
        <path d="M54 382H230L254 398H446M754 398H946L970 374H1148"/>
        <path d="M58 348L106 322L152 366L198 338M106 322L198 338L230 382M992 64L1038 38L1084 82L1130 54M1038 38L1130 54"/>
      </g>
      <path d="M54 382H230L254 398H446" fill="none" stroke="#a5f3fc" stroke-width="2" stroke-dasharray="6 394">
        <animate attributeName="stroke-dashoffset" values="400;0" dur="24s" repeatCount="indefinite"/>
      </path>
      <g fill="#7dd3fc">
        <circle cx="58" cy="348" r="2"/><circle cx="152" cy="366" r="2"/>
        <circle cx="198" cy="338" r="2"/><circle cx="992" cy="64" r="2"/>
        <circle cx="1084" cy="82" r="2"/><circle cx="1130" cy="54" r="2"/>
        <circle cx="106" cy="322" r="3">
          <animate attributeName="opacity" values="0.5;0.5;1;0.5" keyTimes="0;0.65;0.8;1" dur="18s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1038" cy="38" r="3">
          <animate attributeName="opacity" values="0.5;0.5;1;0.5" keyTimes="0;0.5;0.7;1" dur="23s" repeatCount="indefinite"/>
        </circle>
      </g>
      <g fill="#a5f3fc" opacity="0.7">
        <circle cx="326" cy="390" r="1"/><circle cx="516" cy="28" r="1"/>
        <circle cx="868" cy="394" r="1"/><circle cx="682" cy="24" r="1"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;12 -3;0 0" dur="30s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- Stars remain away from the main typography. -->
    <g fill="#c5e9ff" opacity="0.5">
      <circle cx="76" cy="68" r="1.5"/><circle cx="280" cy="42" r="1"/>
      <circle cx="412" cy="85" r="1"/><circle cx="812" cy="54" r="1.3"/>
      <circle cx="1094" cy="66" r="1.5"/><circle cx="1150" cy="339" r="1"/>
      <circle cx="300" cy="350" r="1"/><circle cx="848" cy="371" r="1"/>
      <animate attributeName="opacity" values="0.25;0.65;0.25" dur="7s" repeatCount="indefinite"/>
    </g>
    <g fill="#7dd3fc" opacity="0.35">
      <circle cx="146" cy="340" r="1.4"/><circle cx="353" cy="63" r="1"/>
      <circle cx="727" cy="88" r="1"/><circle cx="965" cy="38" r="1.2"/>
      <circle cx="1050" cy="374" r="1.4"/><circle cx="54" cy="270" r="1"/>
      <animate attributeName="opacity" values="0.55;0.2;0.55" dur="9s" repeatCount="indefinite"/>
    </g>

    <!-- Sparse neural connections frame the title without crossing it. -->
    <g fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.22">
      <path d="M32 196L102 122L178 166L230 108M32 196L108 263L178 166L212 286M102 122L108 263L212 286M178 166L248 220"/>
      <path d="M968 124L1032 170L1110 117L1172 206L1098 282L1032 170L964 272M1110 117L1098 282L964 272M1032 170L941 210"/>
      <animate attributeName="stroke-opacity" values="0.16;0.3;0.16" dur="10s" repeatCount="indefinite"/>
    </g>
    <g fill="none" stroke="#67e8f9" stroke-width="1.4" stroke-dasharray="5 190" opacity="0.5">
      <path d="M32 196L102 122L178 166L248 220"/>
      <path d="M1172 206L1098 282L1032 170L968 124"/>
      <animate attributeName="stroke-dashoffset" from="195" to="0" dur="12s" repeatCount="indefinite"/>
    </g>
    <g fill="#67e8f9" filter="url(#glow)" opacity="0.65">
      <circle cx="32" cy="196" r="2.5"/><circle cx="102" cy="122" r="3"/>
      <circle cx="108" cy="263" r="3"/><circle cx="230" cy="108" r="2"/>
      <circle cx="212" cy="286" r="2.5"/><circle cx="248" cy="220" r="2"/>
      <circle cx="178" cy="166" r="4">
        <animate attributeName="r" values="3;4.5;3" dur="6s" repeatCount="indefinite"/>
      </circle>
      <animate attributeName="opacity" values="0.45;0.8;0.45" dur="8s" repeatCount="indefinite"/>
    </g>
    <g fill="#a5b4fc" filter="url(#glow)" opacity="0.65">
      <circle cx="968" cy="124" r="2.5"/><circle cx="1110" cy="117" r="3"/>
      <circle cx="1172" cy="206" r="2.5"/><circle cx="1098" cy="282" r="3"/>
      <circle cx="964" cy="272" r="2"/><circle cx="941" cy="210" r="2"/>
      <circle cx="1032" cy="170" r="4">
        <animate attributeName="r" values="4.5;3;4.5" dur="7s" repeatCount="indefinite"/>
      </circle>
      <animate attributeName="opacity" values="0.8;0.45;0.8" dur="9s" repeatCount="indefinite"/>
    </g>

    <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
      <text x="600" y="76" fill="#7dd3fc" font-size="12" letter-spacing="5">DATA · INTELLIGENCE · ENGINEERING</text>
      <text x="600" y="178" fill="url(#lettering)" font-size="78" font-weight="700" letter-spacing="7">SREE DEV A</text>
      <text x="600" y="231" fill="#b6d8f3" font-size="27" font-weight="500" letter-spacing="6">AI / ML ENGINEER</text>
      <text x="600" y="276" fill="#9eafc9" font-size="18" letter-spacing="1.5">MACHINE LEARNING • COMPUTER VISION • GENERATIVE AI</text>
      <text x="600" y="354" fill="#b4c3d9" font-size="18">Building intelligent systems that turn ideas into reality_</text>
    </g>
    <path d="M400 310H800" stroke="#25364e"/>
    <rect x="400" y="309" width="100" height="2" rx="1" fill="url(#beam)">
      <animate attributeName="x" values="400;700;400" dur="10s" repeatCount="indefinite"/>
    </rect>
    <path d="M34 40H66M34 40V72M1166 348V380H1134" fill="none" stroke="#67e8f9" stroke-opacity="0.4"/>
  </g>
  <rect x="1" y="1" width="1198" height="418" rx="24" fill="none" stroke="#718ab6" stroke-opacity="0.25"/>
</svg>
