<svg width="1200" height="420" viewBox="0 0 1200 420"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

```
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#020617"/>
  <stop offset="45%" stop-color="#07152b"/>
  <stop offset="100%" stop-color="#020617"/>
</linearGradient>

<linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#38bdf8">
    <animate attributeName="stop-color"
             values="#38bdf8;#818cf8;#22d3ee;#38bdf8"
             dur="7s"
             repeatCount="indefinite"/>
  </stop>

  <stop offset="50%" stop-color="#818cf8">
    <animate attributeName="stop-color"
             values="#818cf8;#22d3ee;#38bdf8;#818cf8"
             dur="7s"
             repeatCount="indefinite"/>
  </stop>

  <stop offset="100%" stop-color="#22d3ee">
    <animate attributeName="stop-color"
             values="#22d3ee;#38bdf8;#818cf8;#22d3ee"
             dur="7s"
             repeatCount="indefinite"/>
  </stop>
</linearGradient>

<radialGradient id="orb">
  <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
  <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
</radialGradient>

<filter id="glow">
  <feGaussianBlur stdDeviation="5" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<filter id="softGlow">
  <feGaussianBlur stdDeviation="12"/>
</filter>
```

  </defs>

  <!-- BACKGROUND -->

  <rect width="1200" height="420" rx="25" fill="url(#bg)"/>

  <!-- MOVING GLOW ORBS -->

<circle cx="180" cy="100" r="150"
       fill="url(#orb)"
       opacity="0.16"
       filter="url(#softGlow)"> <animate attributeName="cx"
          values="120;300;120"
          dur="12s"
          repeatCount="indefinite"/> </circle>

<circle cx="1000" cy="320" r="170"
       fill="url(#orb)"
       opacity="0.12"
       filter="url(#softGlow)"> <animate attributeName="cx"
          values="1050;850;1050"
          dur="14s"
          repeatCount="indefinite"/> </circle>

