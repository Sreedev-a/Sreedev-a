<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 580 280"
     width="580"
     height="280"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Real-Time Hand Gesture Recognition</title>
  <desc id="desc">
    Animated computer vision pipeline showing hand landmarks being detected
    and passed to a gesture recognition model.
  </desc>

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111c"/>
      <stop offset="100%" stop-color="#071522"/>
    </linearGradient>

    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1b2b"/>
      <stop offset="100%" stop-color="#0c2133"/>
    </linearGradient>

    <radialGradient id="ambient">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".16"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity=".04"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid"
             width="48"
             height="48"
             patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48"
            fill="none"
            stroke="#38bdf8"
            stroke-opacity=".035"
            stroke-width="1"/>
    </pattern>

    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

  </defs>


  <!-- ================================================== -->
  <!-- BACKGROUND                                         -->
  <!-- ================================================== -->

  <rect width="580"
        height="280"
        rx="18"
        fill="url(#bg)"/>

  <rect width="580"
        height="280"
        rx="18"
        fill="url(#grid)"/>

  <circle cx="115"
          cy="140"
          r="120"
          fill="url(#ambient)"
          filter="url(#softGlow)">
    <animate attributeName="opacity"
             values=".35;.7;.35"
             dur="7s"
             repeatCount="indefinite"/>
  </circle>


  <!-- ================================================== -->
  <!-- HAND DETECTION AREA                                -->
  <!-- ================================================== -->

  <!-- subtle detection ring -->

  <circle cx="108"
          cy="140"
          r="66"
          fill="none"
          stroke="#38bdf8"
          stroke-width="1"
          stroke-opacity="0">

    <animate attributeName="r"
             values="55;70;55"
             dur="4s"
             repeatCount="indefinite"/>

    <animate attributeName="stroke-opacity"
             values="0;.12;0"
             dur="4s"
             repeatCount="indefinite"/>

  </circle>


  <!-- ================================================== -->
  <!-- HAND LANDMARK CONNECTIONS                          -->
  <!-- ================================================== -->

  <g fill="none"
     stroke="#7dd3fc"
     stroke-width="3"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!-- wrist -> left finger -->

    <path d="M108 165 L66 110"
          pathLength="1"
          stroke-dasharray="1"
          stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset"
               values="1;0;0"
               keyTimes="0;.35;1"
               dur="3.8s"
               repeatCount="indefinite"/>
    </path>

    <!-- wrist -> index -->

    <path d="M108 165 L98 112 L90 78"
          pathLength="1"
          stroke-dasharray="1"
          stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset"
               values="1;0;0"
               keyTimes="0;.42;1"
               dur="3.8s"
               begin=".15s"
               repeatCount="indefinite"/>
    </path>

    <!-- wrist -> middle -->

    <path d="M108 165 L132 106"
          pathLength="1"
          stroke-dasharray="1"
          stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset"
               values="1;0;0"
               keyTimes="0;.42;1"
               dur="3.8s"
               begin=".3s"
               repeatCount="indefinite"/>
    </path>

    <!-- wrist -> right -->

    <path d="M108 165 L151 137"
          pathLength="1"
          stroke-dasharray="1"
          stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset"
               values="1;0;0"
               keyTimes="0;.42;1"
               dur="3.8s"
               begin=".45s"
               repeatCount="indefinite"/>
    </path>

  </g>


  <!-- ================================================== -->
  <!-- LANDMARK JOINTS                                    -->
  <!-- ================================================== -->

  <!-- WRIST -->

  <circle cx="108"
          cy="165"
          r="8"
          fill="#7dd3fc"
          filter="url(#glow)">

    <animate attributeName="r"
             values="7;9;7"
             dur="2.5s"
             repeatCount="indefinite"/>

  </circle>


  <!-- LEFT FINGER -->

  <circle cx="66"
          cy="110"
          r="6.5"
          fill="#7dd3fc">

    <animate attributeName="opacity"
             values=".35;1;1"
             dur="3.8s"
             repeatCount="indefinite"/>

    <animate attributeName="r"
             values="5.5;7;6.5"
             dur="3.8s"
             repeatCount="indefinite"/>

  </circle>


  <!-- INDEX LOWER -->

  <circle cx="98"
          cy="112"
          r="6.5"
          fill="#7dd3fc">

    <animate attributeName="opacity"
             values=".25;.25;1;1"
             keyTimes="0;.15;.4;1"
             dur="3.8s"
             repeatCount="indefinite"/>

  </circle>


  <!-- INDEX TIP -->

  <circle cx="90"
          cy="78"
          r="6.5"
          fill="#7dd3fc"
          filter="url(#glow)">

    <animate attributeName="opacity"
             values=".2;.2;1;1"
             keyTimes="0;.2;.5;1"
             dur="3.8s"
             repeatCount="indefinite"/>

    <animate attributeName="r"
             values="5.5;5.5;7.5;6.5"
             keyTimes="0;.2;.5;1"
             dur="3.8s"
             repeatCount="indefinite"/>

  </circle>


  <!-- MIDDLE -->

  <circle cx="132"
          cy="106"
          r="6.5"
          fill="#7dd3fc"
          filter="url(#glow)">

    <animate attributeName="opacity"
             values=".2;.2;1;1"
             keyTimes="0;.25;.55;1"
             dur="3.8s"
             repeatCount="indefinite"/>

  </circle>


  <!-- RIGHT -->

  <circle cx="151"
          cy="137"
          r="6.5"
          fill="#7dd3fc"
          filter="url(#glow)">

    <animate attributeName="opacity"
             values=".2;.2;1;1"
             keyTimes="0;.3;.65;1"
             dur="3.8s"
             repeatCount="indefinite"/>

  </circle>


  <!-- ================================================== -->
  <!-- LANDMARK SCAN PULSE                                -->
  <!-- ================================================== -->

  <circle cx="108"
          cy="165"
          r="9"
          fill="none"
          stroke="#38bdf8"
          stroke-width="1.5">

    <animate attributeName="r"
             values="9;38"
             dur="3s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values=".65;0"
             dur="3s"
             repeatCount="indefinite"/>

  </circle>


  <!-- ================================================== -->
  <!-- SIGNAL ARROW                                       -->
  <!-- ================================================== -->

  <line x1="188"
        y1="140"
        x2="246"
        y2="140"
        stroke="#4f91b3"
        stroke-width="2.5"/>

  <path d="M238 131 L247 140 L238 149"
        fill="none"
        stroke="#7dd3fc"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>


  <!-- moving inference signal -->

  <circle cy="140"
          r="3.2"
          fill="#7dd3fc"
          filter="url(#glow)">

    <animate attributeName="cx"
             values="190;241"
             dur="2.2s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values="0;1;1;0"
             keyTimes="0;.15;.8;1"
             dur="2.2s"
             repeatCount="indefinite"/>

  </circle>


  <!-- second packet -->

  <circle cy="140"
          r="1.7"
          fill="#38bdf8">

    <animate attributeName="cx"
             values="190;241"
             dur="2.2s"
             begin=".2s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values="0;.7;.7;0"
             keyTimes="0;.15;.8;1"
             dur="2.2s"
             begin=".2s"
             repeatCount="indefinite"/>

  </circle>


  <!-- ================================================== -->
  <!-- RECOGNITION CARD                                   -->
  <!-- ================================================== -->

  <rect x="270"
        y="83"
        width="255"
        height="114"
        rx="16"
        fill="url(#card)"
        stroke="#4f91b3"
        stroke-width="1.2">

    <animate attributeName="stroke-opacity"
             values=".55;1;.55"
             dur="4s"
             repeatCount="indefinite"/>

  </rect>


  <!-- animated top highlight -->

  <line y1="84"
        y2="84"
        stroke="#7dd3fc"
        stroke-width="1.3"
        stroke-linecap="round"
        filter="url(#glow)">

    <animate attributeName="x1"
             values="290;430"
             dur="4.5s"
             repeatCount="indefinite"/>

    <animate attributeName="x2"
             values="325;465"
             dur="4.5s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values="0;.75;0"
             dur="4.5s"
             repeatCount="indefinite"/>

  </line>


  <!-- REAL-TIME CV -->

  <text x="292"
        y="120"
        fill="#7dd3fc"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14"
        font-weight="600"
        letter-spacing="1.6">
    REAL-TIME CV
  </text>


  <!-- Gesture Recognition -->

  <text x="292"
        y="153"
        fill="#f8fafc"
        font-family="Arial, Helvetica, sans-serif"
        font-size="21"
        font-weight="700">
    Gesture Recognition
  </text>


  <!-- pipeline -->

  <text x="292"
        y="178"
        fill="#94a3b8"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13">
    Camera → Landmarks → Class
  </text>


  <!-- status indicator -->

  <circle cx="497"
          cy="112"
          r="3"
          fill="#38bdf8"
          filter="url(#glow)">

    <animate attributeName="r"
             values="2.5;3.8;2.5"
             dur="2s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values=".3;1;.3"
             dur="2s"
             repeatCount="indefinite"/>

  </circle>


  <!-- ================================================== -->
  <!-- BOTTOM ANALYSIS INDICATOR                          -->
  <!-- ================================================== -->

  <g transform="translate(290 221)">

    <circle cx="0" cy="0" r="2" fill="#38bdf8">
      <animate attributeName="opacity"
               values=".2;1;.2"
               dur="1.8s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="13" cy="0" r="2" fill="#38bdf8">
      <animate attributeName="opacity"
               values=".2;1;.2"
               dur="1.8s"
               begin=".3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="26" cy="0" r="2" fill="#38bdf8">
      <animate attributeName="opacity"
               values=".2;1;.2"
               dur="1.8s"
               begin=".6s"
               repeatCount="indefinite"/>
    </circle>

    <text x="40"
          y="4"
          fill="#475569"
          font-family="monospace"
          font-size="8"
          letter-spacing=".7">
      LANDMARK INFERENCE
    </text>

  </g>


  <!-- ================================================== -->
  <!-- OUTER BORDER                                       -->
  <!-- ================================================== -->

  <rect x=".75"
        y=".75"
        width="578.5"
        height="278.5"
        rx="17.25"
        fill="none"
        stroke="#38bdf8"
        stroke-opacity=".08"
        stroke-width="1.5"/>

</svg>
