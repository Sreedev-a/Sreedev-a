<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 580 280"
     width="580"
     height="280"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Retinal Analysis Pipeline</title>
  <desc id="desc">
    Animated retinal computer vision analysis pipeline with scanning,
    detection pulses and CNN signal processing.
  </desc>

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111c"/>
      <stop offset="55%" stop-color="#071522"/>
      <stop offset="100%" stop-color="#081827"/>
    </linearGradient>

    <!-- Pipeline Card -->
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1b2b"/>
      <stop offset="100%" stop-color="#0c2133"/>
    </linearGradient>

    <!-- Retina -->
    <radialGradient id="retinaGlow">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity=".65"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity=".30"/>
      <stop offset="72%" stop-color="#38bdf8" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient Background Glow -->
    <radialGradient id="ambient">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".15"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity=".04"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid -->
    <pattern id="grid"
             width="46"
             height="46"
             patternUnits="userSpaceOnUse">

      <path d="M46 0H0V46"
            fill="none"
            stroke="#38bdf8"
            stroke-opacity=".04"
            stroke-width="1"/>

      <circle cx="0"
              cy="0"
              r="1"
              fill="#7dd3fc"
              opacity=".10"/>

    </pattern>

    <!-- Glow -->
    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur stdDeviation="3"
                      result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <filter id="softGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur stdDeviation="12"/>

    </filter>

    <!-- Retina Clip -->
    <clipPath id="retinaClip">
      <circle cx="118"
              cy="140"
              r="78"/>
    </clipPath>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND                                        -->
  <!-- ================================================= -->

  <rect width="580"
        height="280"
        rx="18"
        fill="url(#bg)"/>

  <rect width="580"
        height="280"
        rx="18"
        fill="url(#grid)"/>


  <!-- Ambient Glow -->

  <circle cx="115"
          cy="140"
          r="145"
          fill="url(#ambient)"
          filter="url(#softGlow)">

    <animate attributeName="opacity"
             values=".35;.70;.35"
             dur="8s"
             repeatCount="indefinite"/>

  </circle>


  <!-- ================================================= -->
  <!-- BACKGROUND PARTICLES                              -->
  <!-- ================================================= -->

  <g fill="#7dd3fc">

    <circle cx="37" cy="42" r="1.2">
      <animate attributeName="opacity"
               values=".1;.7;.1"
               dur="6s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="196" cy="44" r="1">
      <animate attributeName="cy"
               values="44;34;44"
               dur="9s"
               repeatCount="indefinite"/>
      <animate attributeName="opacity"
               values=".1;.55;.1"
               dur="9s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="224" cy="232" r="1.2">
      <animate attributeName="cy"
               values="232;218;232"
               dur="11s"
               repeatCount="indefinite"/>
      <animate attributeName="opacity"
               values=".1;.65;.1"
               dur="7s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="525" cy="47" r="1.2">
      <animate attributeName="opacity"
               values=".1;.65;.1"
               dur="8s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="544" cy="230" r="1">
      <animate attributeName="cx"
               values="544;530;544"
               dur="12s"
               repeatCount="indefinite"/>
      <animate attributeName="opacity"
               values=".1;.55;.1"
               dur="12s"
               repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- ================================================= -->
  <!-- LARGE RETINAL SCANNER                             -->
  <!-- ================================================= -->


  <!-- Outer Detection Ring -->

  <circle cx="118"
          cy="140"
          r="78"
          fill="#071725"
          stroke="#38bdf8"
          stroke-opacity=".50"
          stroke-width="1.4"/>


  <!-- Retina Background -->

  <circle cx="118"
          cy="140"
          r="72"
          fill="url(#retinaGlow)">

    <animate attributeName="opacity"
             values=".50;.85;.50"
             dur="4s"
             repeatCount="indefinite"/>

  </circle>


  <!-- Outer Rotating Segments -->

  <g transform="translate(118 140)">

    <circle r="66"
            fill="none"
            stroke="#7dd3fc"
            stroke-width="1.4"
            stroke-opacity=".35"
            stroke-dasharray="45 16 25 18 36 14">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="20s"
        repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- Counter Rotating Ring -->

  <g transform="translate(118 140)">

    <circle r="54"
            fill="none"
            stroke="#38bdf8"
            stroke-width="1"
            stroke-opacity=".28"
            stroke-dasharray="24 11 38 15">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="360"
        to="0"
        dur="15s"
        repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- Inner Ring -->

  <circle cx="118"
          cy="140"
          r="40"
          fill="none"
          stroke="#7dd3fc"
          stroke-width="1"
          stroke-opacity=".20"/>


  <!-- ================================================= -->
  <!-- RETINAL VESSEL / ANALYSIS LINES                   -->
  <!-- ================================================= -->

  <g stroke="#7dd3fc"
     stroke-width="1.5"
     stroke-opacity=".48"
     stroke-linecap="round">

    <line x1="118" y1="140"
          x2="118" y2="66"/>

    <line x1="118" y1="140"
          x2="166" y2="83"/>

    <line x1="118" y1="140"
          x2="188" y2="117"/>

    <line x1="118" y1="140"
          x2="186" y2="164"/>

    <line x1="118" y1="140"
          x2="163" y2="198"/>

    <line x1="118" y1="140"
          x2="115" y2="214"/>

    <line x1="118" y1="140"
          x2="70" y2="198"/>

    <line x1="118" y1="140"
          x2="49" y2="166"/>

    <line x1="118" y1="140"
          x2="49" y2="116"/>

    <line x1="118" y1="140"
          x2="72" y2="82"/>

  </g>


  <!-- Secondary Vessel Branches -->

  <g stroke="#38bdf8"
     stroke-width="1"
     stroke-opacity=".30"
     stroke-linecap="round">

    <path d="M118 105 L98 89"/>
    <path d="M144 109 L159 101"/>
    <path d="M157 153 L175 148"/>
    <path d="M145 174 L158 187"/>
    <path d="M95 175 L80 188"/>
    <path d="M78 145 L60 151"/>
    <path d="M83 116 L68 104"/>

  </g>


  <!-- ================================================= -->
  <!-- CENTER / OPTIC POINT                              -->
  <!-- ================================================= -->

  <circle cx="118"
          cy="140"
          r="10"
          fill="#7dd3fc"
          filter="url(#glow)">

    <animate attributeName="r"
             values="8;11;8"
             dur="2.4s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values=".75;1;.75"
             dur="2.4s"
             repeatCount="indefinite"/>

  </circle>


  <circle cx="118"
          cy="140"
          r="4"
          fill="#e0f2fe"/>


  <!-- ================================================= -->
  <!-- EXPANDING DETECTION PULSE                         -->
  <!-- ================================================= -->

  <circle cx="118"
          cy="140"
          r="12"
          fill="none"
          stroke="#38bdf8"
          stroke-width="1.5">

    <animate attributeName="r"
             values="12;70"
             dur="3.5s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values=".75;0"
             dur="3.5s"
             repeatCount="indefinite"/>

  </circle>


  <!-- Second Pulse -->

  <circle cx="118"
          cy="140"
          r="12"
          fill="none"
          stroke="#7dd3fc"
          stroke-width="1">

    <animate attributeName="r"
             values="12;70"
             dur="3.5s"
             begin="1.75s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values=".45;0"
             dur="3.5s"
             begin="1.75s"
             repeatCount="indefinite"/>

  </circle>


  <!-- ================================================= -->
  <!-- ROTATING SCANNER                                  -->
  <!-- ================================================= -->

  <g transform="translate(118 140)">

    <path d="
      M0 0
      L0 -72
      A72 72 0 0 1 31 -65
      Z"
      fill="#38bdf8"
      opacity=".13">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="6s"
        repeatCount="indefinite"/>

    </path>

  </g>


  <!-- ================================================= -->
  <!-- HORIZONTAL RETINAL SCAN                           -->
  <!-- ================================================= -->

  <g clip-path="url(#retinaClip)">

    <line x1="42"
          y1="75"
          x2="194"
          y2="75"
          stroke="#7dd3fc"
          stroke-width="1.3"
          filter="url(#glow)">

      <animate attributeName="y1"
               values="70;210;70"
               dur="5.5s"
               repeatCount="indefinite"/>

      <animate attributeName="y2"
               values="70;210;70"
               dur="5.5s"
               repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values="0;.65;0"
               dur="5.5s"
               repeatCount="indefinite"/>

    </line>

  </g>


  <!-- ================================================= -->
  <!-- SMALL DETECTION POINTS                            -->
  <!-- ================================================= -->

  <g fill="#7dd3fc"
     filter="url(#glow)">

    <circle cx="155"
            cy="105"
            r="2.5">

      <animate attributeName="opacity"
               values=".15;1;.15"
               dur="3s"
               repeatCount="indefinite"/>

    </circle>

    <circle cx="82"
            cy="119"
            r="2">

      <animate attributeName="opacity"
               values=".15;1;.15"
               dur="3.7s"
               repeatCount="indefinite"/>

    </circle>

    <circle cx="145"
            cy="171"
            r="2.3">

      <animate attributeName="opacity"
               values=".15;1;.15"
               dur="4.1s"
               repeatCount="indefinite"/>

    </circle>

    <circle cx="92"
            cy="177"
            r="2">

      <animate attributeName="opacity"
               values=".15;1;.15"
               dur="3.4s"
               repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- ================================================= -->
  <!-- CONNECTION TO PIPELINE                            -->
  <!-- ================================================= -->

  <line x1="202"
        y1="140"
        x2="244"
        y2="140"
        stroke="#475569"
        stroke-width="1.7"/>


  <path d="M237 133 L245 140 L237 147"
        fill="none"
        stroke="#7dd3fc"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"/>


  <!-- Moving Signal -->

  <circle cy="140"
          r="3.3"
          fill="#7dd3fc"
          filter="url(#glow)">

    <animate attributeName="cx"
             values="204;240"
             dur="1.8s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values="0;1;1;0"
             keyTimes="0;.15;.8;1"
             dur="1.8s"
             repeatCount="indefinite"/>

  </circle>


  <!-- Trailing Signal -->

  <circle cy="140"
          r="1.6"
          fill="#38bdf8">

    <animate attributeName="cx"
             values="204;240"
             dur="1.8s"
             begin=".18s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values="0;.7;.7;0"
             keyTimes="0;.15;.8;1"
             dur="1.8s"
             begin=".18s"
             repeatCount="indefinite"/>

  </circle>


  <!-- ================================================= -->
  <!-- PIPELINE CARD                                     -->
  <!-- ================================================= -->

  <rect x="260"
        y="82"
        width="275"
        height="116"
        rx="15"
        fill="url(#card)"
        stroke="#4f91b3"
        stroke-width="1.2">

    <animate attributeName="stroke-opacity"
             values=".50;1;.50"
             dur="4s"
             repeatCount="indefinite"/>

  </rect>


  <!-- Animated Top Highlight -->

  <line y1="83"
        y2="83"
        stroke="#7dd3fc"
        stroke-width="1.4"
        stroke-linecap="round"
        filter="url(#glow)">

    <animate attributeName="x1"
             values="280;430"
             dur="4.5s"
             repeatCount="indefinite"/>

    <animate attributeName="x2"
             values="315;465"
             dur="4.5s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values="0;.8;0"
             dur="4.5s"
             repeatCount="indefinite"/>

  </line>


  <!-- Pipeline Label -->

  <text x="282"
        y="116"
        fill="#7dd3fc"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        font-weight="600"
        letter-spacing="1.5">
    VISION PIPELINE
  </text>


  <!-- Pipeline Title -->

  <text x="282"
        y="151"
        fill="#f8fafc"
        font-family="Arial, Helvetica, sans-serif"
        font-size="22"
        font-weight="700">
    Retinal Analysis
  </text>


  <!-- Pipeline Description -->

  <text x="282"
        y="178"
        fill="#94a3b8"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13">
    Preprocess → CNN → Signals
  </text>


  <!-- ================================================= -->
  <!-- ACTIVE STATUS                                     -->
  <!-- ================================================= -->

  <circle cx="507"
          cy="111"
          r="3"
          fill="#38bdf8"
          filter="url(#glow)">

    <animate attributeName="r"
             values="2.5;3.8;2.5"
             dur="2s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values=".3;1;.3"
             dur="2s"
             repeatCount="indefinite"/>

  </circle>


  <!-- ================================================= -->
  <!-- BOTTOM ANALYSIS STATUS                            -->
  <!-- ================================================= -->

  <g transform="translate(280 224)">

    <circle cx="0"
            cy="0"
            r="2"
            fill="#38bdf8">

      <animate attributeName="opacity"
               values=".2;1;.2"
               dur="1.8s"
               repeatCount="indefinite"/>

    </circle>


    <circle cx="13"
            cy="0"
            r="2"
            fill="#38bdf8">

      <animate attributeName="opacity"
               values=".2;1;.2"
               dur="1.8s"
               begin=".3s"
               repeatCount="indefinite"/>

    </circle>


    <circle cx="26"
            cy="0"
            r="2"
            fill="#38bdf8">

      <animate attributeName="opacity"
               values=".2;1;.2"
               dur="1.8s"
               begin=".6s"
               repeatCount="indefinite"/>

    </circle>


    <text x="40"
          y="4"
          fill="#475569"
          font-family="monospace"
          font-size="8"
          letter-spacing=".7">
      ANALYZING RETINAL SIGNALS
    </text>

  </g>


  <!-- ================================================= -->
  <!-- OUTER BORDER                                      -->
  <!-- ================================================= -->

  <rect x=".75"
        y=".75"
        width="578.5"
        height="278.5"
        rx="17.25"
        fill="none"
        stroke="#38bdf8"
        stroke-opacity=".08"
        stroke-width="1.5"/>

</svg>
