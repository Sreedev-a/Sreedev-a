<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 580 280"
     width="580"
     height="280"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Retinal Analysis Pipeline</title>
  <desc id="desc">
    Animated retinal analysis pipeline showing retinal scanning,
    signal transmission and CNN processing.
  </desc>

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111c"/>
      <stop offset="55%" stop-color="#071522"/>
      <stop offset="100%" stop-color="#081827"/>
    </linearGradient>

    <!-- Card -->
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1b2b"/>
      <stop offset="100%" stop-color="#0c2133"/>
    </linearGradient>

    <!-- Moving ambient glow -->
    <radialGradient id="ambient">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".18"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Retina -->
    <radialGradient id="retina">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity=".8"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity=".04"/>
    </radialGradient>

    <!-- Glow -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <!-- Grid -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48"
            fill="none"
            stroke="#38bdf8"
            stroke-opacity=".055"
            stroke-width="1"/>
      <circle cx="0" cy="0" r="1"
              fill="#7dd3fc"
              opacity=".12"/>
    </pattern>

    <!-- Scan clip -->
    <clipPath id="retinaClip">
      <circle cx="108" cy="140" r="48"/>
    </clipPath>

  </defs>


  <!-- =====================================================
       BACKGROUND
       ===================================================== -->

  <rect width="580"
        height="280"
        rx="18"
        fill="url(#bg)"/>

  <rect width="580"
        height="280"
        rx="18"
        fill="url(#grid)"/>


  <!-- Ambient moving glow -->

  <circle cx="100"
          cy="120"
          r="125"
          fill="url(#ambient)"
          filter="url(#softGlow)">

    <animate attributeName="cx"
             values="80;180;80"
             dur="14s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values=".5;.8;.5"
             dur="8s"
             repeatCount="indefinite"/>

  </circle>


  <!-- =====================================================
       PARTICLES
       ===================================================== -->

  <g fill="#7dd3fc">

    <circle cx="45" cy="52" r="1.3">
      <animate attributeName="opacity"
               values=".15;.8;.15"
               dur="5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="190" cy="45" r="1">
      <animate attributeName="cy"
               values="45;36;45"
               dur="8s"
               repeatCount="indefinite"/>
      <animate attributeName="opacity"
               values=".15;.65;.15"
               dur="8s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="278" cy="220" r="1.2">
      <animate attributeName="cy"
               values="220;207;220"
               dur="11s"
               repeatCount="indefinite"/>
      <animate attributeName="opacity"
               values=".1;.7;.1"
               dur="7s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="520" cy="65" r="1.2">
      <animate attributeName="opacity"
               values=".1;.75;.1"
               dur="6s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="540" cy="225" r="1">
      <animate attributeName="cx"
               values="540;525;540"
               dur="12s"
               repeatCount="indefinite"/>
      <animate attributeName="opacity"
               values=".15;.6;.15"
               dur="9s"
               repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- =====================================================
       RETINAL SCANNER
       ===================================================== -->

  <!-- Outer circle -->

  <circle cx="108"
          cy="140"
          r="48"
          fill="#081a29"
          stroke="#38bdf8"
          stroke-opacity=".45"
          stroke-width="1.3"/>


  <!-- Subtle retinal glow -->

  <circle cx="108"
          cy="140"
          r="43"
          fill="url(#retina)">

    <animate attributeName="opacity"
             values=".45;.8;.45"
             dur="4s"
             repeatCount="indefinite"/>

  </circle>


  <!-- Rotating retinal rings -->

  <g transform="translate(108 140)"
     fill="none"
     stroke="#7dd3fc">

    <g>

      <circle r="35"
              stroke-width="1"
              stroke-opacity=".24"
              stroke-dasharray="38 12 20 15"/>

      <circle r="25"
              stroke-width="1"
              stroke-opacity=".20"
              stroke-dasharray="22 9 14 10"/>

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="18s"
        repeatCount="indefinite"/>

    </g>

  </g>


  <!-- Retina radial vessels -->

  <g stroke="#38bdf8"
     stroke-width="1"
     stroke-opacity=".45"
     stroke-linecap="round">

    <line x1="108" y1="140" x2="108" y2="96"/>
    <line x1="108" y1="140" x2="143" y2="112"/>
    <line x1="108" y1="140" x2="151" y2="144"/>
    <line x1="108" y1="140" x2="139" y2="174"/>
    <line x1="108" y1="140" x2="105" y2="185"/>
    <line x1="108" y1="140" x2="73" y2="174"/>
    <line x1="108" y1="140" x2="64" y2="138"/>
    <line x1="108" y1="140" x2="77" y2="108"/>

  </g>


  <!-- Center -->

  <circle cx="108"
          cy="140"
          r="7"
          fill="#7dd3fc"
          filter="url(#glow)">

    <animate attributeName="r"
             values="6;8;6"
             dur="2.5s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values=".8;1;.8"
             dur="2.5s"
             repeatCount="indefinite"/>

  </circle>


  <!-- Detection pulse -->

  <circle cx="108"
          cy="140"
          r="8"
          fill="none"
          stroke="#38bdf8"
          stroke-width="1.5">

    <animate attributeName="r"
             values="8;43"
             dur="3s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values=".75;0"
             dur="3s"
             repeatCount="indefinite"/>

  </circle>


  <!-- Rotating scan beam -->

  <g transform="translate(108 140)">

    <path d="M0 0 L0 -43 A43 43 0 0 1 20 -38 Z"
          fill="#38bdf8"
          opacity=".12">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="6s"
        repeatCount="indefinite"/>

    </path>

  </g>


  <!-- Horizontal scan line -->

  <g clip-path="url(#retinaClip)">

    <line x1="62"
          y1="105"
          x2="154"
          y2="105"
          stroke="#7dd3fc"
          stroke-width="1"
          opacity=".5"
          filter="url(#glow)">

      <animate attributeName="y1"
               values="102;178;102"
               dur="5s"
               repeatCount="indefinite"/>

      <animate attributeName="y2"
               values="102;178;102"
               dur="5s"
               repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values="0;.6;0"
               dur="5s"
               repeatCount="indefinite"/>

    </line>

  </g>


  <!-- =====================================================
       SIGNAL / ARROW
       ===================================================== -->

  <line x1="165"
        y1="140"
        x2="232"
        y2="140"
        stroke="#475569"
        stroke-width="1.5"/>

  <path d="M226 134 L233 140 L226 146"
        fill="none"
        stroke="#7dd3fc"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>


  <!-- Moving data packet -->

  <circle cy="140"
          r="3.2"
          fill="#7dd3fc"
          filter="url(#glow)">

    <animate attributeName="cx"
             values="166;228"
             dur="2.4s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values="0;1;1;0"
             keyTimes="0;.15;.8;1"
             dur="2.4s"
             repeatCount="indefinite"/>

  </circle>


  <!-- Tiny trailing packet -->

  <circle cy="140"
          r="1.6"
          fill="#38bdf8">

    <animate attributeName="cx"
             values="166;228"
             dur="2.4s"
             begin=".15s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values="0;.7;.7;0"
             keyTimes="0;.15;.8;1"
             dur="2.4s"
             begin=".15s"
             repeatCount="indefinite"/>

  </circle>


  <!-- =====================================================
       PIPELINE CARD
       ===================================================== -->

  <rect x="250"
        y="88"
        width="270"
        height="104"
        rx="12"
        fill="url(#card)"
        stroke="#38bdf8"
        stroke-opacity=".32"
        stroke-width="1.2">

    <animate attributeName="stroke-opacity"
             values=".25;.55;.25"
             dur="4s"
             repeatCount="indefinite"/>

  </rect>


  <!-- Moving top accent -->

  <line y1="89"
        y2="89"
        stroke="#7dd3fc"
        stroke-width="1.4"
        stroke-linecap="round"
        filter="url(#glow)">

    <animate attributeName="x1"
             values="265;420"
             dur="4s"
             repeatCount="indefinite"/>

    <animate attributeName="x2"
             values="300;455"
             dur="4s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values="0;.8;0"
             dur="4s"
             repeatCount="indefinite"/>

  </line>


  <!-- Label -->

  <text x="272"
        y="115"
        fill="#7dd3fc"
        font-family="Arial, Helvetica, sans-serif"
        font-size="10"
        font-weight="700"
        letter-spacing="1.6">
    VISION PIPELINE
  </text>


  <!-- Main title -->

  <text x="272"
        y="143"
        fill="#f8fafc"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        font-weight="700">
    Retinal Analysis
  </text>


  <!-- Description -->

  <text x="272"
        y="166"
        fill="#94a3b8"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11">
    Preprocess → CNN → Signals
  </text>


  <!-- Status -->

  <circle cx="488"
          cy="113"
          r="3"
          fill="#38bdf8"
          filter="url(#glow)">

    <animate attributeName="opacity"
             values=".3;1;.3"
             dur="2s"
             repeatCount="indefinite"/>

    <animate attributeName="r"
             values="2.5;3.5;2.5"
             dur="2s"
             repeatCount="indefinite"/>

  </circle>

  <text x="475"
        y="133"
        fill="#64748b"
        font-family="monospace"
        font-size="8">
    ACTIVE
  </text>


  <!-- =====================================================
       BOTTOM DATA INDICATORS
       ===================================================== -->

  <g transform="translate(250 213)">

    <circle cx="5" cy="0" r="2" fill="#38bdf8">
      <animate attributeName="opacity"
               values=".25;1;.25"
               dur="1.8s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="18" cy="0" r="2" fill="#38bdf8">
      <animate attributeName="opacity"
               values=".25;1;.25"
               dur="1.8s"
               begin=".3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="31" cy="0" r="2" fill="#38bdf8">
      <animate attributeName="opacity"
               values=".25;1;.25"
               dur="1.8s"
               begin=".6s"
               repeatCount="indefinite"/>
    </circle>

    <text x="45"
          y="4"
          fill="#475569"
          font-family="monospace"
          font-size="8"
          letter-spacing=".7">
      ANALYZING VISUAL SIGNALS
    </text>

  </g>


  <!-- =====================================================
       BORDER
       ===================================================== -->

  <rect x=".75"
        y=".75"
        width="578.5"
        height="278.5"
        rx="17.25"
        fill="none"
        stroke="#38bdf8"
        stroke-opacity=".10"
        stroke-width="1.5"/>

</svg>
