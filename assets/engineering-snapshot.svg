<svg width="100%" height="auto" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" style="background:transparent;">
  <defs>
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.02" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2a4a" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="280" fill="url(#grid)" opacity="0.4"/>

  <!-- Card 1: AI/ML Engineering -->
  <rect x="40" y="20" width="260" height="240" rx="16" fill="#0a1428" stroke="#1a3a5c" stroke-width="1.5" opacity="0.9"/>
  <rect x="40" y="20" width="260" height="240" rx="16" fill="url(#glassGradient)"/>
  
  <circle cx="90" cy="70" r="20" fill="#3b82f6" opacity="0.4"/>
  <circle cx="280" cy="100" r="30" fill="#3b82f6" opacity="0.2"/>
  
  <text x="60" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#e0f0ff">
    AI/ML Engineering
  </text>
  <text x="60" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a8c5e0" opacity="0.9" dominant-baseline="hanging">
    Building intelligent end-to-end
  </text>
  <text x="60" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a8c5e0" opacity="0.9" dominant-baseline="hanging">
    applications and production
  </text>
  <text x="60" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a8c5e0" opacity="0.9" dominant-baseline="hanging">
    ML systems.
  </text>

  <!-- Card 2: Computer Vision -->
  <rect x="330" y="20" width="260" height="240" rx="16" fill="#0a1428" stroke="#1a3a5c" stroke-width="1.5" opacity="0.9"/>
  <rect x="330" y="20" width="260" height="240" rx="16" fill="url(#glassGradient)"/>
  
  <circle cx="380" cy="70" r="20" fill="#3b82f6" opacity="0.4"/>
  <circle cx="570" cy="100" r="30" fill="#3b82f6" opacity="0.2"/>
  
  <text x="350" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#e0f0ff">
    Computer Vision
  </text>
  <text x="350" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a8c5e0" opacity="0.9" dominant-baseline="hanging">
    Real-time visual understanding,
  </text>
  <text x="350" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a8c5e0" opacity="0.9" dominant-baseline="hanging">
    detection and monitoring
  </text>
  <text x="350" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a8c5e0" opacity="0.9" dominant-baseline="hanging">
    systems.
  </text>

  <!-- Card 3: Agentic AI -->
  <rect x="620" y="20" width="260" height="240" rx="16" fill="#0a1428" stroke="#1a3a5c" stroke-width="1.5" opacity="0.9"/>
  <rect x="620" y="20" width="260" height="240" rx="16" fill="url(#glassGradient)"/>
  
  <circle cx="670" cy="70" r="20" fill="#3b82f6" opacity="0.4"/>
  <circle cx="860" cy="100" r="30" fill="#3b82f6" opacity="0.2"/>
  
  <text x="640" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#e0f0ff">
    Agentic AI
  </text>
  <text x="640" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a8c5e0" opacity="0.9" dominant-baseline="hanging">
    RAG, tool calling, multi-step
  </text>
  <text x="640" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a8c5e0" opacity="0.9" dominant-baseline="hanging">
    reasoning and intelligent
  </text>
  <text x="640" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a8c5e0" opacity="0.9" dominant-baseline="hanging">
    workflows.
  </text>

  <!-- Card 4: Full-Stack AI -->
  <rect x="910" y="20" width="250" height="240" rx="16" fill="#0a1428" stroke="#1a3a5c" stroke-width="1.5" opacity="0.9"/>
  <rect x="910" y="20" width="250" height="240" rx="16" fill="url(#glassGradient)"/>
  
  <circle cx="958" cy="70" r="20" fill="#3b82f6" opacity="0.4"/>
  <circle cx="1135" cy="100" r="30" fill="#3b82f6" opacity="0.2"/>
  
  <text x="930" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#e0f0ff">
    Full-Stack AI
  </text>
  <text x="930" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a8c5e0" opacity="0.9" dominant-baseline="hanging">
    Python/FastAPI backends
  </text>
  <text x="930" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a8c5e0" opacity="0.9" dominant-baseline="hanging">
    with modern Next.js
  </text>
  <text x="930" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a8c5e0" opacity="0.9" dominant-baseline="hanging">
    frontends.
  </text>
</svg>
