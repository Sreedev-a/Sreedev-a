<svg width="100%" height="auto" viewBox="0 0 1200 280"
     xmlns="http://www.w3.org/2000/svg"
     style="background:transparent;">

  <defs>
    <!-- Glass -->
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glow -->
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40"
            fill="none"
            stroke="#1a2a4a"
            stroke-width="0.5"
            opacity="0.3"/>
    </pattern>

    <style>
      /* ==========================
         CARD FLOATING
      ========================== */

      .card {
        transform-box: fill-box;
        transform-origin: center;
        animation: cardFloat 6s ease-in-out infinite;
      }

      .c2 { animation-delay: -1.5s; }
      .c3 { animation-delay: -3s; }
      .c4 { animation-delay: -4.5s; }

      @keyframes cardFloat {
        0%, 100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-4px);
        }
      }

      /* ==========================
         SMALL ORBS
      ========================== */

      .orb-sm {
        transform-box: fill-box;
        transform-origin: center;
        animation: orbPulse 3.2s ease-in-out infinite;
      }

      @keyframes orbPulse {
        0%, 100% {
          transform: scale(1);
          opacity: .4;
        }

        50% {
          transform: scale(1.22);
          opacity: .75;
        }
      }

      /* ==========================
         LARGE ORBS
      ========================== */

      .orb-lg {
        transform-box: fill-box;
        transform-origin: center;
        animation: orbDrift 5s ease-in-out infinite;
      }

      @keyframes orbDrift {
        0%, 100% {
          transform: translate(0,0) scale(1);
          opacity: .18;
        }

        50% {
          transform: translate(-8px,7px) scale(1.12);
          opacity: .34;
        }
      }

      /* ==========================
         TITLE GLOW
      ========================== */

      .title {
        animation: titleGlow 3.6s ease-in-out infinite;
      }

      @keyframes titleGlow {
        0%, 100% {
          filter: drop-shadow(0 0 0 #60a5fa);
        }

        50% {
          filter: drop-shadow(0 0 5px #60a5fa);
        }
      }

      /* ==========================
         SCANNING LIGHT
      ========================== */

      .scan {
        animation: scanMove 5s linear infinite;
      }

      @keyframes scanMove {
        0% {
          transform: translateX(-180px);
          opacity: 0;
        }

        15% {
          opacity: .45;
        }

        85% {
          opacity: .45;
        }

        100% {
          transform: translateX(1380px);
          opacity: 0;
        }
      }

      /* ==========================
         PARTICLES
      ========================== */

      .particle {
        animation: particleFloat 7s ease-in-out infinite;
      }

      .p2 { animation-delay: -2s; }
      .p3 { animation-delay: -4s; }
      .p4 { animation-delay: -5.5s; }

      @keyframes particleFloat {
        0%, 100% {
          transform: translate(0,0);
          opacity: .15;
        }

        50% {
          transform: translate(8px,-12px);
          opacity: .65;
        }
      }

      /* Accessibility */

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
        }
      }
    </style>
  </defs>


  <!-- ==========================
       ANIMATED GRID BACKGROUND
  =========================== -->

  <rect width="1200"
        height="280"
        fill="url(#grid)"
        opacity="0.4">

    <animate
      attributeName="opacity"
      values="0.28;0.48;0.28"
      dur="6s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ==========================
       FLOATING PARTICLES
  =========================== -->

  <g opacity="0.45">

    <circle class="particle"
            cx="25"
            cy="230"
            r="2"
            fill="#60a5fa"/>

    <circle class="particle p2"
            cx="315"
            cy="45"
            r="1.7"
            fill="#93c5fd"/>

    <circle class="particle p3"
            cx="600"
            cy="245"
            r="2"
            fill="#60a5fa"/>

    <circle class="particle p4"
            cx="895"
            cy="55"
            r="1.6"
            fill="#bfdbfe"/>

    <circle class="particle p2"
            cx="1175"
            cy="225"
            r="2"
            fill="#60a5fa"/>

  </g>


  <!-- ==========================
       SCANNING GLOW
  =========================== -->

  <rect
    class="scan"
    x="-180"
    y="0"
    width="150"
    height="280"
    fill="url(#pulseGlow)"
    opacity="0.25"/>


  <!-- ==========================
       AI / ML CARD
  =========================== -->

  <g class="card c1">

    <rect x="40"
          y="20"
          width="260"
          height="240"
          rx="16"
          fill="#0a1428"
          stroke="#1a3a5c"
          stroke-width="1.5"
          opacity="0.9"/>

    <rect x="40"
          y="20"
          width="260"
          height="240"
          rx="16"
          fill="url(#glassGradient)"/>

    <circle class="orb-sm"
            cx="90"
            cy="70"
            r="20"
            fill="#3b82f6"
            opacity="0.4"/>

    <circle class="orb-lg"
            cx="280"
            cy="100"
            r="30"
            fill="#3b82f6"
            opacity="0.2"/>

    <text class="title"
          x="60"
          y="120"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="18"
          font-weight="600"
          fill="#e0f0ff">

      AI/ML Engineering

    </text>

    <text x="60" y="150"
          font-family="system-ui, sans-serif"
          font-size="13"
          fill="#a8c5e0">

      Building intelligent end-to-end

    </text>

    <text x="60" y="170"
          font-family="system-ui, sans-serif"
          font-size="13"
          fill="#a8c5e0">

      applications and production

    </text>

    <text x="60" y="190"
          font-family="system-ui, sans-serif"
          font-size="13"
          fill="#a8c5e0">

      ML systems.

    </text>

  </g>


  <!-- ==========================
       COMPUTER VISION CARD
  =========================== -->

  <g class="card c2">

    <rect x="330"
          y="20"
          width="260"
          height="240"
          rx="16"
          fill="#0a1428"
          stroke="#1a3a5c"
          stroke-width="1.5"
          opacity="0.9"/>

    <rect x="330"
          y="20"
          width="260"
          height="240"
          rx="16"
          fill="url(#glassGradient)"/>

    <circle class="orb-sm"
            cx="380"
            cy="70"
            r="20"
            fill="#3b82f6"/>

    <circle class="orb-lg"
            cx="570"
            cy="100"
            r="30"
            fill="#3b82f6"/>

    <text class="title"
          x="350"
          y="120"
          font-family="system-ui, sans-serif"
          font-size="18"
          font-weight="600"
          fill="#e0f0ff">

      Computer Vision

    </text>

    <text x="350" y="150"
          font-family="system-ui, sans-serif"
          font-size="13"
          fill="#a8c5e0">

      Real-time visual understanding,

    </text>

    <text x="350" y="170"
          font-family="system-ui, sans-serif"
          font-size="13"
          fill="#a8c5e0">

      detection and monitoring

    </text>

    <text x="350" y="190"
          font-family="system-ui, sans-serif"
          font-size="13"
          fill="#a8c5e0">

      systems.

    </text>

  </g>


  <!-- ==========================
       AGENTIC AI CARD
  =========================== -->

  <g class="card c3">

    <rect x="620"
          y="20"
          width="260"
          height="240"
          rx="16"
          fill="#0a1428"
          stroke="#1a3a5c"
          stroke-width="1.5"
          opacity="0.9"/>

    <rect x="620"
          y="20"
          width="260"
          height="240"
          rx="16"
          fill="url(#glassGradient)"/>

    <circle class="orb-sm"
            cx="670"
            cy="70"
            r="20"
            fill="#3b82f6"/>

    <circle class="orb-lg"
            cx="860"
            cy="100"
            r="30"
            fill="#3b82f6"/>

    <text class="title"
          x="640"
          y="120"
          font-family="system-ui, sans-serif"
          font-size="18"
          font-weight="600"
          fill="#e0f0ff">

      Agentic AI

    </text>

    <text x="640" y="150"
          font-family="system-ui, sans-serif"
          font-size="13"
          fill="#a8c5e0">

      RAG, tool calling, multi-step

    </text>

    <text x="640" y="170"
          font-family="system-ui, sans-serif"
          font-size="13"
          fill="#a8c5e0">

      reasoning and intelligent

    </text>

    <text x="640" y="190"
          font-family="system-ui, sans-serif"
          font-size="13"
          fill="#a8c5e0">

      workflows.

    </text>

  </g>


  <!-- ==========================
       FULL STACK AI CARD
  =========================== -->

  <g class="card c4">

    <rect x="910"
          y="20"
          width="250"
          height="240"
          rx="16"
          fill="#0a1428"
          stroke="#1a3a5c"
          stroke-width="1.5"
          opacity="0.9"/>

    <rect x="910"
          y="20"
          width="250"
          height="240"
          rx="16"
          fill="url(#glassGradient)"/>

    <circle class="orb-sm"
            cx="958"
            cy="70"
            r="20"
            fill="#3b82f6"/>

    <circle class="orb-lg"
            cx="1135"
            cy="100"
            r="30"
            fill="#3b82f6"/>

    <text class="title"
          x="930"
          y="120"
          font-family="system-ui, sans-serif"
          font-size="18"
          font-weight="600"
          fill="#e0f0ff">

      Full-Stack AI

    </text>

    <text x="930" y="150"
          font-family="system-ui, sans-serif"
          font-size="13"
          fill="#a8c5e0">

      Python/FastAPI backends

    </text>

    <text x="930" y="170"
          font-family="system-ui, sans-serif"
          font-size="13"
          fill="#a8c5e0">

      with modern Next.js

    </text>

    <text x="930" y="190"
          font-family="system-ui, sans-serif"
          font-size="13"
          fill="#a8c5e0">

      frontends.

    </text>

  </g>

</svg>
