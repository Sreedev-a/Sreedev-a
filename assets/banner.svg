<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#03040a"/>
      <stop offset="60%" stop-color="#071025"/>
      <stop offset="100%" stop-color="#081022"/>
    </linearGradient>
    <radialGradient id="accent" cx="70%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#9ad8ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6b5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glassBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.8"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="b" mode="normal"/>
    </filter>
  </defs>

  <rect width="1400" height="420" fill="url(#bg)" />
  <rect x="-260" y="-180" width="720" height="720" rx="360" fill="url(#accent)" opacity="0.06" />
  <rect x="900" y="-200" width="700" height="700" rx="350" fill="#08102a" opacity="0.06" />

  <!-- central frosted card -->
  <g transform="translate(70,52)">
    <rect width="1260" height="316" rx="26" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)" stroke-width="1" filter="url(#glassBlur)"/>

    <!-- Left column text -->
    <g transform="translate(56,42)">
      <text x="0" y="22" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial" font-size="20" fill="#9fb4ff" opacity="0.95">Sreedev A</text>
      <text x="0" y="64" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial" font-weight="700" font-size="42" fill="#ffffff">AI/ML Engineer</text>

      <foreignObject x="0" y="92" width="620" height="96">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; color:#dfe9ff; font-size:15px; line-height:1.5;">
          <strong style="color:#ffffff; font-size:15px;">Building intelligent systems that bridge AI, computer vision and modern software.</strong>
          <div style="height:8px"></div>
          <div style="color:#9fb4ff; font-size:13px; opacity:0.9">AI • Machine Learning • Computer Vision • Full‑Stack AI Systems</div>
        </div>
      </foreignObject>

      <!-- tags row -->
      <g transform="translate(0,180)" fill="#cfe9ff" opacity="0.95">
        <rect x="0" y="-14" width="132" height="28" rx="14" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.03)"/>
        <text x="14" y="8" font-size="12">Artificial Intelligence</text>

        <g transform="translate(152,0)">
          <rect x="0" y="-14" width="112" height="28" rx="14" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.03)"/>
          <text x="12" y="8" font-size="12">Machine Learning</text>
        </g>

        <g transform="translate(276,0)">
          <rect x="0" y="-14" width="124" height="28" rx="14" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.03)"/>
          <text x="12" y="8" font-size="12">Computer Vision</text>
        </g>

        <g transform="translate(408,0)">
          <rect x="0" y="-14" width="68" height="28" rx="14" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.03)"/>
          <text x="12" y="8" font-size="12">Python</text>
        </g>

        <g transform="translate(490,0)">
          <rect x="0" y="-14" width="156" height="28" rx="14" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.03)"/>
          <text x="12" y="8" font-size="12">Full-Stack AI Systems</text>
        </g>
      </g>

    </g>

    <!-- Right visual column -->
    <g transform="translate(746,44)">
      <rect x="0" y="0" width="460" height="228" rx="16" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.03)"/>

      <!-- subtle camera + waveform -->
      <g transform="translate(22,18)">
        <rect x="0" y="0" width="200" height="136" rx="10" fill="#071021" stroke="rgba(255,255,255,0.02)"/>
        <rect x="10" y="10" width="180" height="116" rx="8" fill="rgba(0,0,0,0.45)"/>
        <rect x="26" y="26" width="72" height="44" rx="6" fill="rgba(154,216,255,0.06)" stroke="#9ad8ff" opacity="0.22"/>
        <rect x="108" y="26" width="72" height="44" rx="6" fill="rgba(107,92,255,0.03)" stroke="#6b5cff" opacity="0.12"/>

        <g transform="translate(0,92)" fill="#9fb4ff" font-size="12">
          <text x="0" y="14">MeetMux — AI + scheduling experiments</text>
        </g>
      </g>

      <!-- decoration orbs -->
      <circle cx="360" cy="50" r="28" fill="#9ad8ff" opacity="0.06">
        <animate attributeName="cy" from="44" to="56" dur="9s" repeatCount="indefinite"/>
      </circle>
    </g>

  </g>

</svg>
