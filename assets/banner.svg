<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1f3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1428;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <radialGradient id="accentGradient" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#0a0e27;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)"/>
  
  <!-- Accent glow -->
  <circle cx="200" cy="50" r="300" fill="url(#accentGradient)" />
  <circle cx="1000" cy="350" r="250" fill="url(#accentGradient)" />
  
  <!-- Subtle grid lines -->
  <line x1="0" y1="200" x2="1200" y2="200" stroke="#00d9ff" stroke-width="1" opacity="0.05"/>
  <line x1="600" y1="0" x2="600" y2="400" stroke="#00d9ff" stroke-width="1" opacity="0.05"/>
  
  <!-- Accent line decoration -->
  <line x1="100" y1="150" x2="250" y2="150" stroke="#00d9ff" stroke-width="2" opacity="0.4"/>
  
  <!-- Main title -->
  <text x="600" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
    Sreedev A
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500" fill="#00d9ff" text-anchor="middle" opacity="0.9">
    AI/ML Engineer
  </text>
  
  <!-- Description -->
  <text x="600" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#a8b5d1" text-anchor="middle">
    Building intelligent, production-ready systems
  </text>
  
  <!-- Tagline -->
  <text x="600" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#7a8ba8" text-anchor="middle">
    ML • Computer Vision • Generative AI • Automation • Full-Stack AI
  </text>
  
  <!-- Bottom accent line -->
  <line x1="950" y1="330" x2="1100" y2="330" stroke="#00d9ff" stroke-width="2" opacity="0.4"/>
</svg>