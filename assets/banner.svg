<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#05060a"/>
      <stop offset="50%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#071021"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="frost" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.7"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="blur" mode="normal"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)" />
  <rect x="-200" y="-100" width="600" height="600" rx="300" fill="url(#glow)" opacity="0.08" />
  <rect x="800" y="-120" width="700" height="700" rx="350" fill="#0b1530" opacity="0.06" />

  <!-- frosted hero card -->
  <g transform="translate(60,36)">
    <rect width="1080" height="288" rx="22" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1" filter="url(#frost)"/>

    <!-- left text column -->
    <g transform="translate(48,36)">
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" font-size="22" fill="#9fb4ff" opacity="0.95">Sreedev A</text>
      <text x="0" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" font-weight="700" font-size="36" fill="#ffffff">AI/ML Engineer</text>

      <foreignObject x="0" y="82" width="560" height="110">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; color:#dfe9ff; font-size:14px; line-height:1.45; opacity:0.95;">
          <strong style="color:#ffffff;">Building intelligent systems that bridge AI, computer vision and modern software.</strong>
        </div>
      </foreignObject>

      <!-- tags -->
      <g transform="translate(0,160)" fill="#cfe9ff" opacity="0.95">
        <rect x="0" y="-12" width="120" height="28" rx="14" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)"/>
        <text x="14" y="8" font-size="12" fill="#cfe9ff">Artificial Intelligence</text>

        <g transform="translate(140,0)">
          <rect x="0" y="-12" width="100" height="28" rx="14" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)"/>
          <text x="12" y="8" font-size="12" fill="#cfe9ff">Machine Learning</text>
        </g>

        <g transform="translate(260,0)">
          <rect x="0" y="-12" width="120" height="28" rx="14" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)"/>
          <text x="12" y="8" font-size="12" fill="#cfe9ff">Computer Vision</text>
        </g>

        <g transform="translate(390,0)">
          <rect x="0" y="-12" width="72" height="28" rx="14" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)"/>
          <text x="12" y="8" font-size="12" fill="#cfe9ff">Python</text>
        </g>

        <g transform="translate(470,0)">
          <rect x="0" y="-12" width="140" height="28" rx="14" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)"/>
          <text x="12" y="8" font-size="12" fill="#cfe9ff">Full-Stack AI Systems</text>
        </g>
      </g>

    </g>

    <!-- subtle orb animation (slow) -->
    <g transform="translate(720,32)">
      <circle cx="120" cy="64" r="44" fill="#00d9ff" opacity="0.06">
        <animate attributeName="cx" from="110" to="130" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="170" cy="160" r="18" fill="#6b5cff" opacity="0.04">
        <animate attributeName="cy" from="150" to="170" dur="10s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- small right column visual placeholder -->
    <g transform="translate(720,36)">
      <rect x="0" y="0" width="300" height="200" rx="14" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.03)" />
      <!-- webcam frame icon -->
      <g transform="translate(24,22)">
        <rect x="0" y="0" width="96" height="60" rx="8" fill="#071021" stroke="rgba(255,255,255,0.03)"/>
        <rect x="6" y="6" width="84" height="48" rx="6" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.02)"/>
        <circle cx="48" cy="30" r="10" fill="#0ff" opacity="0.08"/>
        <rect x="110" y="10" width="150" height="120" rx="8" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.02)"/>
      </g>
    </g>

  </g>

</svg>