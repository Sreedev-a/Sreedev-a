<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180">
  <title>AI engineering network — data to model to system</title>
  <defs>
    <linearGradient id="surface" x2="1" y2="0">
      <stop stop-color="#070f1d" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#070f1d" stop-opacity="0.7"/>
      <stop offset="0.7" stop-color="#070f1d" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#070f1d" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#0891b2" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x2="1" y2="0">
      <stop stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="180" fill="url(#surface)"/>
  <ellipse cx="600" cy="82" rx="360" ry="82" fill="url(#glow)"/>
  <path d="M0 1H1200M0 179H1200" fill="none" stroke="url(#edge)"/>
  <g fill="none" stroke="#38bdf8" stroke-width="0.6" opacity="0.05">
    <path d="M120 56H272M120 76H272M120 96H272M140 36V116M160 36V116M180 36V116"/>
    <path d="M928 84H1080M928 104H1080M928 124H1080M1020 64V144M1040 64V144M1060 64V144"/>
  </g>
  <g fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.15">
    <path d="M120 90H286L318 70H390M810 70H882L914 90H1080"/>
    <path d="M390 70L530 54L600 90L670 54L810 70M390 70L530 110L600 90L670 110L810 70M530 54V110M670 54V110"/>
    <path d="M600 90V128"/>
  </g>
  <!-- Short signal packets move through the central network over a long cycle. -->
  <path d="M390 70L530 54L600 90L670 54L810 70" pathLength="1000" fill="none" stroke="#67e8f9" stroke-width="1.4" stroke-dasharray="12 988" stroke-dashoffset="1000" opacity="0.28">
    <animate attributeName="stroke-dashoffset" values="1000;0" dur="26s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.28;0.28;0" keyTimes="0;0.15;0.85;1" dur="26s" repeatCount="indefinite"/>
  </path>
  <g fill="#7dd3fc" opacity="0.22">
    <circle cx="390" cy="70" r="2.5"/><circle cx="530" cy="54" r="2.5"/>
    <circle cx="530" cy="110" r="2"/><circle cx="670" cy="54" r="2.5"/>
    <circle cx="670" cy="110" r="2"/><circle cx="810" cy="70" r="2.5"/>
  </g>
  <g opacity="0.15">
    <circle cx="600" cy="90" r="9" fill="none" stroke="#38bdf8" stroke-width="0.8"/>
    <circle cx="600" cy="90" r="3" fill="#67e8f9"/>
    <animate attributeName="opacity" values="0.15;0.15;0.3;0.15" keyTimes="0;0.65;0.82;1" dur="22s" repeatCount="indefinite"/>
  </g>
  <g fill="#9ac9e5" opacity="0.42" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2" text-anchor="middle">
    <text x="390" y="53">ML</text><text x="530" y="37">CV</text>
    <text x="670" y="37">RAG</text><text x="810" y="53">AGENTS</text>
    <text x="600" y="147" font-size="12" opacity="0.8">DATA → MODEL → SYSTEM</text>
  </g>
  <g fill="#7dd3fc" opacity="0.07" font-family="monospace" font-size="9" letter-spacing="3">
    <text x="154" y="42">0100 1101</text><text x="224" y="140">[0.12, 0.08]</text>
    <text x="936" y="48">0010 0110</text><text x="918" y="148">1011 0001</text>
  </g>
  <g fill="#7dd3fc" opacity="0.1">
    <circle cx="306" cy="122" r="1"/><circle cx="894" cy="40" r="1"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;8 -2;0 0" dur="32s" repeatCount="indefinite"/>
  </g>
  <text x="600" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#9ac9e5" opacity="0.2">Designed &amp; built by Sreedev A</text>
</svg>
